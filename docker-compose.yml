services:

  postgres:
    image: postgres:16
    container_name: supplyprescript-db
    restart: always

    environment:
      POSTGRES_DB: supplyprescript
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplyprescript"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: supplyprescript-backend
    restart: always

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supplyprescript

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
